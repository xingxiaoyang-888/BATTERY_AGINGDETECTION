services:
  sodium-twin:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - workspace:/app/data/workspace
    environment:
      SODIUM_DATA_DIR: /app/data/workspace
      SODIUM_MODEL_DIR: /app/artifacts
      SODIUM_WEB_DIR: /app/web/dist
      SODIUM_API_KEY: ${SODIUM_API_KEY:?Set a random SODIUM_API_KEY of at least 32 characters}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    restart: unless-stopped
volumes:
  workspace:

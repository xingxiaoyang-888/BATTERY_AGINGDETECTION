[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sodium-twin"
version = "3.0.1"
description = "Battery intelligence, uncertainty-aware forecasting, and digital twins"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.7,<1", "starlette>=1.10,<2", "anyio>=4.14.2,<5",
  "idna>=3.15,<4", "uvicorn>=0.30,<1", "pydantic>=2.8,<3",
  "numpy>=1.24,<3", "pandas>=2.0,<3",
]

[project.optional-dependencies]
ml = [
  "torch>=2.15,<3", "filelock>=4.2.1,<5",
  "safetensors>=0.5.3,<1",
]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
fmu = ["fmpy>=0.3.22,<1", "joblib>=1.3,<2"]

[project.scripts]
sodium-twin = "sodium_twin.__main__:main"

[tool.setuptools.packages.find]
include = ["sodium_twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

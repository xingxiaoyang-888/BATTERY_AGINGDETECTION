name: Verify Sodium Twin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'torch>=2.15,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[test,ml]' -r requirements.txt pip-audit
      - run: python -m pytest tests test -q
      - run: python tools/check_english.py
      - run: python tools/audit_dependencies.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
